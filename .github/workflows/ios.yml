name: Build iOS IPA

on:
  push:
    branches: [ main, "feat/*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build & Export iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install

      - name: Sync Capacitor iOS Project
        run: |
          npx cap sync ios
          # Ensure manual signing and disabled profiles in pbxproj after capacitor sync
          sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' ios/App/App.xcodeproj/project.pbxproj 2>/dev/null || true
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/App/App.xcodeproj/project.pbxproj 2>/dev/null || true

      - name: Install Apple Certificate and Provisioning Profile
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD || 'buildagentpassword' }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$APPLE_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Clean Derived Data
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf build/DerivedData build/App.xcarchive build/Payload release

      - name: Build iOS App Archive
        run: |
          mkdir -p build release
          
          if [ -d "ios/App/App.xcworkspace" ]; then
            BUILD_TARGET="-workspace ios/App/App.xcworkspace"
          else
            BUILD_TARGET="-project ios/App/App.xcodeproj"
          fi
          
          echo "Target: $BUILD_TARGET"
          
          # Archive strictly for device (generic/platform=iOS). Never target iphonesimulator for release.
          set -o pipefail
          xcodebuild archive $BUILD_TARGET \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            -skipPackagePluginValidation -skipMacroValidation \
            -verbose \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean archive 2>&1 | tee build/xcodebuild.log || {
              grep -E "(^error:|^.*: error:)" build/xcodebuild.log | head -n 30 | while IFS= read -r line; do
                echo "::error title=XcodeBuild Error::$line"
              done
              exit 65
            }

      - name: Package iOS IPA
        run: |
          mkdir -p release build/Payload
          
          # First check if signed exportArchive is possible with provided signing profile
          if [ -f "ios/ExportOptions.plist" ] && [ -n "${{ secrets.APPLE_CERTIFICATE_BASE64 }}" ]; then
            echo "Attempting official exportArchive..."
            xcodebuild -exportArchive \
              -archivePath build/App.xcarchive \
              -exportPath release \
              -exportOptionsPlist ios/ExportOptions.plist || true
          fi
          
          # If .ipa does not exist yet (unsigned / ad-hoc device build), package from xcarchive payload
          if [ ! -f "release/BizzMitra-ios.ipa" ]; then
            APP_PATH=$(find build/App.xcarchive/Products/Applications -name "*.app" -type d | head -n 1)
            if [ -z "$APP_PATH" ]; then
              APP_PATH=$(find build -name "*.app" -type d | head -n 1)
            fi
            
            if [ -z "$APP_PATH" ]; then
              echo "Error: App bundle not found in xcarchive"
              exit 1
            fi
            
            echo "Found compiled app bundle at: $APP_PATH"
            cp -r "$APP_PATH" build/Payload/
            cd build && zip -r ../release/BizzMitra-ios.ipa Payload && cd ..
          fi
          
          ls -lh release/BizzMitra-ios.ipa

      - name: Upload iOS IPA Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BizzMitra-ios.ipa
          path: release/BizzMitra-ios.ipa
          if-no-files-found: error

      - name: Upload Xcode Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

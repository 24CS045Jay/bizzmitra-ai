name: Build Android APK

on:
  push:
    branches: [ main, "feat/*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Signed Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Build Android Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'bizzmitra2026' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'bizzmitra' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'bizzmitra2026' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cd ..
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/BizzMitra-android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BizzMitra-android.apk
          path: release/BizzMitra-android.apk
          if-no-files-found: error

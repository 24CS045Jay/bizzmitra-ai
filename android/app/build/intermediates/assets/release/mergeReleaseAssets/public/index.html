<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BizzMitra AI — Offline</title>
  <style>
    :root {
      --bg: #F5F3EE;
      --fg: #1B1B1B;
      --muted: #8A8478;
      --surface: #EDEAE3;
      --primary: #FF5A3C;
      --primary-fg: #FFFFFF;
      --border: #D8D4CA;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #181614;
        --fg: #F5F3EE;
        --muted: #9E988D;
        --surface: #22201D;
        --primary: #FF5A3C;
        --primary-fg: #FFFFFF;
        --border: #33302B;
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-top: max(24px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      text-align: center;
      user-select: none;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px 28px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .icon-box {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: rgba(255, 90, 60, 0.12);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .brand-tag {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 8px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
    }
    p {
      font-size: 13px;
      line-height: 1.5;
      color: var(--muted);
      margin-bottom: 28px;
    }
    .btn {
      background: var(--primary);
      color: var(--primary-fg);
      border: none;
      border-radius: 14px;
      padding: 14px 24px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: transform 0.15s ease, opacity 0.15s ease;
      touch-action: manipulation;
    }
    .btn:active {
      transform: scale(0.97);
      opacity: 0.9;
    }
    .status {
      margin-top: 18px;
      font-size: 11px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #EAB308;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-box">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <div class="brand-tag">BizzMitra AI</div>
    <h1>You're Offline</h1>
    <p>Please check your cellular or Wi-Fi network connection to access your digital blueprints and workspace.</p>
    <button class="btn" id="retryBtn" onclick="retryConnection()">Retry Connection</button>
    <div class="status">
      <span class="pulse-dot"></span>
      <span id="statusText">Waiting for network...</span>
    </div>
  </div>

  <script>
    function retryConnection() {
      const btn = document.getElementById("retryBtn");
      const statusText = document.getElementById("statusText");
      btn.innerText = "Checking...";
      btn.disabled = true;
      statusText.innerText = "Reconnecting to BizzMitra portal...";

      if (navigator.onLine) {
        window.location.href = "https://bizzmitra-ai.vercel.app";
      } else {
        setTimeout(function() {
          btn.innerText = "Retry Connection";
          btn.disabled = false;
          statusText.innerText = "Still offline. Please check connection.";
        }, 1200);
      }
    }

    window.addEventListener("online", function() {
      document.getElementById("statusText").innerText = "Connection restored! Loading...";
      window.location.href = "https://bizzmitra-ai.vercel.app";
    });
  </script>
</body>
</html>
